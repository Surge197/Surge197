<svg xmlns="http://www.w3.org/2000/svg" width="640" height="728" viewBox="0 0 640 728" role="img" aria-labelledby="title desc"><title id="title">SURGE — systems in progress</title><desc id="desc">ELVARC: An AI, software and automation ecosystem. Enterprise • Leadership • Ventures • Architecture • Research • Computing. FORGE: An experimental AI chatbot and multi-agent platform exploring an AI gateway, model adapters, Gemini and Anthropic Claude integrations, and AI orchestration. AccuTax: GST reconciliation across Tally and GST portal data: GSTR-1, GSTR-2B and GSTR-3B; monthly and aggregate reconciliation; taxable value, total value, CGST, SGST and IGST difference analysis. AI Review Platform: A developing AI-powered accounting review platform to analyse operations, identify issues and centralize findings. Long-term direction: client-specific AI agents reporting into one central system.</desc><defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111a24"/><stop offset="1" stop-color="#0c1118"/></linearGradient></defs><rect width="640" height="728" rx="18" fill="url(#surface)"/><rect x=".75" y=".75" width="638.5" height="726.5" rx="18" fill="none" stroke="#263340" stroke-width="1.5"/><path d="M24 52H616" stroke="#263340"/><text x="26" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#78d5c2" text-anchor="start" >03</text><text x="66" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#a3b1bf" text-anchor="start" >projects / systems in progress</text><rect x="20" y="75" width="600" height="142" rx="12" fill="#0c1118" stroke="#263340"/><path d="M20 93V199" stroke="#78d5c2" stroke-width="3"/><text x="39" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#78d5c2" text-anchor="start" >AI / SOFTWARE / AUTOMATION</text><text x="39" y="136" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#f0f4f7" text-anchor="start" >ELVARC</text><text x="597" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#a3b1bf" text-anchor="end" >IN DEVELOPMENT</text><text x="39" y="168" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#a3b1bf" text-anchor="start" >An ecosystem for intelligent software</text><text x="39" y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#a3b1bf" text-anchor="start" >and practical business automation.</text><rect x="20" y="233" width="600" height="142" rx="12" fill="#0c1118" stroke="#263340"/><path d="M20 251V357" stroke="#78d5c2" stroke-width="3"/><text x="39" y="259" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#78d5c2" text-anchor="start" >MULTI-AGENT AI PLATFORM</text><text x="39" y="294" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#f0f4f7" text-anchor="start" >FORGE</text><text x="597" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#a3b1bf" text-anchor="end" >EXPERIMENTAL</text><text x="39" y="326" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#a3b1bf" text-anchor="start" >AI gateway, model adapters and</text><text x="39" y="354" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#a3b1bf" text-anchor="start" >multi-agent orchestration.</text><rect x="20" y="391" width="600" height="142" rx="12" fill="#0c1118" stroke="#263340"/><path d="M20 409V515" stroke="#78d5c2" stroke-width="3"/